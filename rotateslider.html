<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circular Slider</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        font-family: Arial, sans-serif;
    }

    /* Outer wrapper to maintain perfect circle */
    .slider-wrapper {
        width: 380px;
        height: 380px;
        position: relative;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0px 0px 25px rgba(255,255,255,0.2);
    }

    /* All slides */
    .slide {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.6s ease-in-out;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-size: 28px;
        font-weight: bold;
    }

    /* Active slide visible */
    .slide.active {
        opacity: 1;
    }

    /* Custom backgrounds for each slide */
    .slide1 { background: linear-gradient(45deg, #ff6a6a, #c40000); }
    .slide2 { background: linear-gradient(45deg, #6a9aff, #0037a3); }
    .slide3 { background: linear-gradient(45deg, #6affc1, #009e63); }

    /* Navigation arrows */
    .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 35px;
        color: white;
        cursor: pointer;
        user-select: none;
        padding: 10px;
    }

    .left { left: -60px; }
    .right { right: -60px; }

    .arrow:hover {
        opacity: 0.6;
    }
</style>
</head>

<body>

<div class="slider-wrapper">
    <div class="slide slide1 active">Slide 1</div>
    <div class="slide slide2">Slide 2</div>
    <div class="slide slide3">Slide 3</div>
</div>

<div class="arrow left" onclick="changeSlide(-1)">&#10094;</div>
<div class="arrow right" onclick="changeSlide(1)">&#10095;</div>

<script>
let index = 0;
const slides = document.querySelectorAll(".slide");

function showSlide(i) {
    slides.forEach(slide => slide.classList.remove("active"));
    index = (i + slides.length) % slides.length;
    slides[index].classList.add("active");
}

function changeSlide(step) {
    showSlide(index + step);
}

setInterval(() => changeSlide(1), 3000); // Auto slide every 3 sec
</script>

</body>
</html>
