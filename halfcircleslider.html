<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arc Slider</title>

<!-- Swiper CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

<style>
    body{
        margin:0;
        padding:0;
        background:#111;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        font-family:sans-serif;
    }

    /* MAIN BOX */
    .sliding-arc-wrapper{
        width:350px;
        height:260px;
        position:relative;
    }

    /* THE ARC SHAPE — curved top only */
    .sliding-arc{
        width:100%;
        height:100%;
        overflow:hidden;

        border-top-left-radius:180px;
        border-top-right-radius:180px;

        border-bottom-left-radius:0;
        border-bottom-right-radius:0;
    }

    .swiper{
        width:100%;
        height:100%;
    }

    .swiper-slide{
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:35px;
        font-weight:bold;
        color:#fff;
    }

    .slide-1{background:linear-gradient(135deg,#ff0040,#ff8a00);}
    .slide-2{background:linear-gradient(135deg,#0077ff,#00d4ff);}
    .slide-3{background:linear-gradient(135deg,#22c55e,#a3e635);}
    .slide-4{background:linear-gradient(135deg,#8b5cf6,#ec4899);}
</style>
</head>

<body>

<div class="sliding-arc-wrapper">
    <div class="sliding-arc">

        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide slide-1">Slide 1</div>
                <div class="swiper-slide slide-2">Slide 2</div>
                <div class="swiper-slide slide-3">Slide 3</div>
                <div class="swiper-slide slide-4">Slide 4</div>
            </div>
            <div class="swiper-pagination"></div>
        </div>

    </div>
</div>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
var swiper = new Swiper(".mySwiper", {
    loop: true,
    pagination: { el: ".swiper-pagination", clickable: true },
    autoplay: { delay: 1500, disableOnInteraction: false }
});
</script>
</body>
</html>
